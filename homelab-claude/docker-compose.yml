# Claude on the homelab: everything lives under ${DATA_ROOT} on this Debian host.
# Nothing here is published to the LAN or the internet: every port binds to 127.0.0.1
# and is exposed to your tailnet only through `tailscale serve` (see host/setup-tailscale.sh).
name: claude-homelab

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

# Memory caps: the host is shared with Nextcloud, Immich, n8n, Home Assistant... If a container
# hits its cap, the kernel kills a process INSIDE that container instead of freezing the host.
# memswap_limit == mem_limit means "no swap" for that container.

networks:
  claude-net:
    name: claude-net   # fixed name so an existing n8n / Home Assistant stack can join it

services:
  claude-box:
    build:
      context: ./claude-box
      args:
        CLAUDE_CODE_VERSION: ${CLAUDE_CODE_VERSION:-latest}
        PUID: ${PUID:-1000}
        PGID: ${PGID:-1000}
    image: claude-box:local
    container_name: claude-box
    hostname: ${CLAUDE_HOSTNAME:-homelab}
    restart: unless-stopped
    mem_limit: ${CLAUDE_MEM_LIMIT:-1536m}     # ~2-3 Claude sessions at once; raise if you add RAM
    memswap_limit: ${CLAUDE_MEM_LIMIT:-1536m}
    pids_limit: 512
    init: true
    logging: *logging
    environment:
      TZ: ${TZ:-Europe/Helsinki}
      RUNNER_TOKEN: ${RUNNER_TOKEN:?set RUNNER_TOKEN in .env}
      JOB_MAX_RUNS_PER_DAY: ${JOB_MAX_RUNS_PER_DAY:-40}
      JOB_TIMEOUT: ${JOB_TIMEOUT:-900}
      JOB_MODEL: ${JOB_MODEL:-haiku}
      HA_URL: ${HA_URL:-}
      HA_TOKEN: ${HA_TOKEN:-}
      # Job notifications -> your phone (ntfy app). Internal URL: never leaves the docker network.
      NTFY_URL: http://ntfy/${NTFY_TOPIC:-claude-jobs}
      NTFY_TOKEN: ${NTFY_RUNNER_TOKEN:-}
      NTFY_ON_OK: ${NTFY_ON_OK:-1}
      CLAUDE_REMOTE_CONTROL_SESSION_NAME_PREFIX: ${CLAUDE_HOSTNAME:-homelab}
    volumes:
      - ${DATA_ROOT:-/srv/claude}/home:/home/claude        # ~/.claude: login, transcripts, memory, settings
      - ${DATA_ROOT:-/srv/claude}/projects:/workspace      # all your code / working folders
      - ${DATA_ROOT:-/srv/claude}/logs:/var/log/claude     # jobs.jsonl (automation audit log)
      - ./jobs:/opt/claude-jobs:ro                         # whitelisted automation jobs
    ports:
      - "127.0.0.1:7681:7681"   # ttyd web terminal -> tailscale serve :8449
    networks: [claude-net]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.1
    container_name: claude-otel
    restart: unless-stopped
    mem_limit: 192m
    memswap_limit: 192m
    logging: *logging
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./monitoring/otel-collector.yaml:/etc/otelcol/config.yaml:ro
    networks: [claude-net]

  prometheus:
    image: prom/prometheus:v3.1.0
    container_name: claude-prometheus
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=400d
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ${DATA_ROOT:-/srv/claude}/prometheus:/prometheus
    networks: [claude-net]

  grafana:
    image: grafana/grafana-oss:11.4.0
    container_name: claude-grafana
    restart: unless-stopped
    mem_limit: 384m
    memswap_limit: 384m
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD in .env}
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ${DATA_ROOT:-/srv/claude}/grafana:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana-dashboards:ro
    ports:
      - "127.0.0.1:3000:3000"   # -> tailscale serve :8450
    networks: [claude-net]

  # Push notifications for job results (and backup failures). Self-hosted: messages stay in
  # ${DATA_ROOT}/ntfy. Login required for everything (auth-default-access: deny-all).
  ntfy:
    image: binwiederhier/ntfy:${NTFY_VERSION:-v2.11.0}
    container_name: claude-ntfy
    restart: unless-stopped
    mem_limit: 96m
    memswap_limit: 96m
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    command: ["serve"]
    environment:
      TZ: ${TZ:-Europe/Helsinki}
      NTFY_BASE_URL: https://${TS_FQDN:-homelab.example.ts.net}:2586
      NTFY_LISTEN_HTTP: ":80"
      NTFY_BEHIND_PROXY: "true"
      NTFY_CACHE_FILE: /var/lib/ntfy/cache.db
      NTFY_CACHE_DURATION: 72h
      NTFY_AUTH_FILE: /var/lib/ntfy/user.db
      NTFY_AUTH_DEFAULT_ACCESS: deny-all
      NTFY_ENABLE_LOGIN: "true"
      # iPhone only: iOS gets instant pushes only via Apple, so ntfy.sh relays a "poll request"
      # (message id + hashed topic, never the text); the app then fetches the message from HERE.
      # Android users can set this empty in .env.
      NTFY_UPSTREAM_BASE_URL: ${NTFY_UPSTREAM_BASE_URL-https://ntfy.sh}
    volumes:
      - ${DATA_ROOT:-/srv/claude}/ntfy:/var/lib/ntfy
    ports:
      - "127.0.0.1:2586:80"     # -> tailscale serve :2586 (and the host backup script)
    networks: [claude-net]

  # Only for a machine WITHOUT n8n. If you already run n8n, leave this off and attach your n8n
  # to the claude-net network instead (PLAN.md, phase 4).   docker compose --profile n8n up -d
  n8n:
    image: docker.n8n.io/n8nio/n8n:${N8N_VERSION:-latest}
    container_name: claude-n8n
    profiles: ["n8n"]
    restart: unless-stopped
    logging: *logging
    user: "${PUID:-1000}:${PGID:-1000}"
    environment:
      GENERIC_TIMEZONE: ${TZ:-Europe/Helsinki}
      TZ: ${TZ:-Europe/Helsinki}
      WEBHOOK_URL: https://${TS_FQDN:-homelab.example.ts.net}:10000/
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_VERSION_NOTIFICATIONS_ENABLED: "false"
      N8N_PERSONALIZATION_ENABLED: "false"
    volumes:
      - ${DATA_ROOT:-/srv/claude}/n8n:/home/node/.n8n
    ports:
      - "127.0.0.1:5678:5678"   # -> tailscale serve :10000
    networks: [claude-net]
